name: long acceptance
on: workflow_dispatch
jobs:
  partitions-and-load:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: prefix-dev/setup-pixi@v0.9.2
        with:
          pixi-version: v0.65.0
          cache: true
      - run: pixi run lint
      - run: pixi run typecheck
      - name: Real wall-time network partitions and nine-board workload
        env:
          FL_TEST_LONG_PARTITIONS: "1"
          FL_PARTITION_REPORT: ${{ runner.temp }}/fl-partitions.json
        run: >-
          pixi run pytest -q tests/integration/test_network_partitions.py
          tests/integration/test_scheduler_load.py
      - uses: actions/upload-artifact@v4
        with:
          name: partition-durations
          path: ${{ runner.temp }}/fl-partitions.json
