name: checks
on: [push, pull_request]
jobs:
  python:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-14]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: prefix-dev/setup-pixi@v0.9.2
        with:
          pixi-version: v0.65.0
          cache: true
      - run: pixi run lint
      - run: pixi run typecheck
      - name: Build and check scheduler dashboard
        if: runner.os == 'Linux'
        run: |
          pixi run -e web web-install
          pixi run -e web web-check
          pixi run -e web web-test
          pixi run -e web web-build
      - name: Install browser acceptance runtime
        if: runner.os == 'Linux'
        working-directory: services/dashboard
        run: |
          export PLAYWRIGHT_BROWSERS_PATH="$RUNNER_TEMP/fl-browsers"
          pixi run -e web npx playwright install --with-deps chromium
          echo "FL_TEST_DASHBOARD_BROWSER=$PLAYWRIGHT_BROWSERS_PATH" >> "$GITHUB_ENV"
      - name: Install pinned network acceptance tools
        if: runner.os == 'Linux'
        run: |
          pixi run python tests/download_network_tools.py --directory "$RUNNER_TEMP/fl-network"
          cat >> "$GITHUB_ENV" <<EOF
          FL_TEST_HEADSCALE=$RUNNER_TEMP/fl-network/headscale
          FL_TEST_TAILSCALE_DIR=$RUNNER_TEMP/fl-network/tailscale_1.102.4_amd64
          EOF
      - name: Build pinned BBCP acceptance tool
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y g++ make libssl-dev zlib1g-dev libnsl-dev openssh-server
          pixi run python tests/build_bbcp.py --directory "$RUNNER_TEMP/fl-bbcp"
          echo "FL_TEST_BBCP=$RUNNER_TEMP/fl-bbcp/bbcp" >> "$GITHUB_ENV"
      - name: Install native Linux deployment validators
        if: runner.os == 'Linux'
        run: |
          pixi install --locked -e deployment
          pixi run python tests/build_haproxy.py --directory "$RUNNER_TEMP/fl-haproxy"
          cat >> "$GITHUB_ENV" <<EOF
          FL_TEST_NGINX=$GITHUB_WORKSPACE/.pixi/envs/deployment/bin/nginx
          FL_TEST_HAPROXY=$RUNNER_TEMP/fl-haproxy/haproxy
          EOF
      - run: pixi run test --basetemp "$RUNNER_TEMP/fl-pytest"
      - name: Retain protected network acceptance diagnostics
        if: always() && runner.os == 'Linux'
        uses: actions/upload-artifact@v4
        with:
          name: private-network-diagnostics
          path: |
            ${{ runner.temp }}/fl-pytest/**/peer-*-transport.log
            ${{ runner.temp }}/fl-pytest/**/peer-*-transport-state.json
            ${{ runner.temp }}/fl-pytest/**/headscale-restart-report.json
            ${{ runner.temp }}/fl-pytest/**/scheduler-restart-report.json
          if-no-files-found: ignore
          retention-days: 7
