# Include in nginx's http block, after services/headscale/nginx.conf defines the
# Upgrade map. Replace PUBLIC_IP and SCHEDULER_HEADSCALE_IP with actual addresses.
limit_req_zone $binary_remote_addr zone=fl_auth:10m rate=10r/m;
limit_req_zone $binary_remote_addr zone=fl_bootstrap:10m rate=20r/m;

server {
    listen PUBLIC_IP:443 ssl;
    server_name scheduler.example.edu;
    ssl_certificate /etc/letsencrypt/live/scheduler.example.edu/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/scheduler.example.edu/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    # OAuth query parameters contain one-use codes; do not put them in access logs.
    access_log off;
    client_max_body_size 2m;
    limit_req_status 429;

    location ^~ /api/agents/ { return 404; }
    location /api/auth/ {
        # nginx upstream errors can include the full OAuth query string.
        error_log /dev/null crit;
        limit_req zone=fl_auth burst=20 nodelay;
        proxy_pass http://127.0.0.1:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-For $remote_addr;
    }
    location /api/enrollment/ {
        limit_req zone=fl_bootstrap burst=5 nodelay;
        proxy_pass http://127.0.0.1:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-For $remote_addr;
    }
    # A final inventory can exceed bootstrap payload sizes. Agent-token authorization
    # permits only this idempotent unregister action; WebSocket/RPC routes stay private.
    location ~ ^/api/enrollment/clusters/[0-9a-f-]+/unregister$ {
        client_max_body_size 64m;
        limit_req zone=fl_bootstrap burst=5 nodelay;
        proxy_pass http://127.0.0.1:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-For $remote_addr;
    }
    location / {
        proxy_pass http://127.0.0.1:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-For $remote_addr;
    }
}

server {
    listen SCHEDULER_HEADSCALE_IP:443 ssl;
    server_name agent.scheduler.example.edu;
    # Obtain this certificate through DNS validation; this host has no public listener.
    ssl_certificate /etc/letsencrypt/live/agent.scheduler.example.edu/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/agent.scheduler.example.edu/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    access_log off;
    client_max_body_size 64m;

    location /api/agents/ {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $fl_connection_upgrade;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        proxy_buffering off;
    }
    location / { return 404; }
}
