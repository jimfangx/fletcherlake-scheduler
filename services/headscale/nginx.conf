# Include inside nginx's http block. Replace hostnames, IPs and certificate paths.
map $http_upgrade $fl_connection_upgrade {
    default upgrade;
    '' close;
}

# These listen directives use the host's PUBLIC address, not a wildcard. The private
# agent listener in scheduler/nginx.conf binds a different, Headscale-only address.
server {
    listen PUBLIC_IP:443 ssl;
    server_name headscale.example.edu;
    ssl_certificate /etc/letsencrypt/live/headscale.example.edu/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/headscale.example.edu/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    access_log off;

    # Administrative REST is reachable only from the scheduler's loopback adapter.
    location ^~ /api/ { return 404; }
    location = /api { return 404; }
    location / {
        proxy_pass http://127.0.0.1:8081;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $fl_connection_upgrade;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        proxy_buffering off;
    }
}
