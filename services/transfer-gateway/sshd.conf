# Dedicated rclone/SFTP SSH server. Replace TRANSFER_PUBLIC_IP and GATEWAY_HEADSCALE_IP.
# Use a real login shell for this account: forced commands execute through it.
Port 22
ListenAddress TRANSFER_PUBLIC_IP
ListenAddress GATEWAY_HEADSCALE_IP
HostKey /etc/fl/transfer-host-ed25519
PidFile /run/fl-transfer-sshd.pid
UsePAM no
PasswordAuthentication no
KbdInteractiveAuthentication no
PubkeyAuthentication yes
AuthenticationMethods publickey
StrictModes yes
AuthorizedKeysFile /var/lib/fl-transfer/authorized_keys
AllowUsers fl-transfer
DisableForwarding yes
PermitTTY no
PermitUserEnvironment no
PermitUserRC no
MaxAuthTries 3
MaxSessions 1
LoginGraceTime 30
LogLevel ERROR
# The per-key forced guard replaces this subsystem with a manifest-only filesystem.
Subsystem sftp internal-sftp
