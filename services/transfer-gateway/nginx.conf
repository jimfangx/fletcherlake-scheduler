# Include in nginx's http block; substitute addresses and hostnames.
limit_req_zone $binary_remote_addr zone=fl_verify:10m rate=20r/m;
server {
    listen TRANSFER_PUBLIC_IP:443 ssl;
    server_name transfer.example.edu;
    ssl_certificate /etc/letsencrypt/live/transfer.example.edu/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/transfer.example.edu/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    access_log off;
    client_max_body_size 16k;
    limit_req_status 429;
    location /api/uploads/ {
        limit_req zone=fl_verify burst=5 nodelay;
        proxy_pass http://127.0.0.1:8081;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_read_timeout 600s;
        add_header Cache-Control no-store always;
    }
    location / { return 404; }
}

server {
    listen GATEWAY_HEADSCALE_IP:443 ssl;
    server_name gateway.internal.example.edu;
    ssl_certificate /etc/letsencrypt/live/gateway.internal.example.edu/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/gateway.internal.example.edu/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    access_log off;
    client_max_body_size 16k;
    location /internal/ {
        proxy_pass http://127.0.0.1:8081;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-For $remote_addr;
        add_header Cache-Control no-store always;
    }
    location / { return 404; }
}
