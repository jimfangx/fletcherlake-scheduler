[workspace]
name = "fletcherlake-platform"
channels = ["conda-forge"]
platforms = ["linux-64", "osx-arm64"]

[dependencies]
python = "3.12.*"
pip = ">=25,<27"
pytest = ">=8,<10"
pytest-asyncio = ">=0.25,<2"
ruff = ">=0.11,<1"
mypy = ">=1.15,<2"
postgresql = ">=17,<19"

[pypi-dependencies]
fletcherlake-platform = { path = ".", editable = true }

[tasks]
test = "pytest"
lint = "ruff check . && ruff format --check ."
typecheck = "mypy"
agent = "fl-agent"

[feature.web.dependencies]
nodejs = ">=24,<25"

[feature.web.tasks]
web-install = { cmd = "npm ci", cwd = "services/dashboard" }
web-check = { cmd = "npm run check", cwd = "services/dashboard" }
web-build = { cmd = "npm run build", cwd = "services/dashboard" }
web-test = { cmd = "npm test", cwd = "services/dashboard" }

[feature.deployment]
platforms = ["linux-64"]

[feature.deployment.dependencies]
nginx = ">=1.30,<1.31"

[environments]
web = { features = ["web"], no-default-feature = true }
deployment = { features = ["deployment"], no-default-feature = true }
